---
- name: Configure Flask Application Server
  hosts: app
  become: yes

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - python3-pip
          - python3-venv
          - git
          - nginx
        state: present

    - name: Create Flask systemd service
      copy:
        dest: /etc/systemd/system/flask-app.service
        content: |
          [Unit]
          Description=Flask Employee Management Application
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/opt/flask-app
          ExecStart=/usr/bin/python3 /opt/flask-app/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable Flask service
      systemd:
        name: flask-app
        enabled: yes

    - name: Start Flask service
      systemd:
        name: flask-app
        state: started
